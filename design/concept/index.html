<script type="module">
const p = new URLSearchParams(location.search), s = p.get('s') || 'hero';
const ui = document.getElementById('ui');
const add = (html) => ui.insertAdjacentHTML('beforeend', html);
const at = (x, y, z, html, dx = 0, dy = 0) => { let [sx, sy] = window.__project(x, y, z); const zf = window.__uiz || 1; sx /= zf; sy /= zf; add(`<div class="anchor" style="left:${sx + dx}px;top:${sy + dy}px">${html}</div>`); };
const nav = (active) => add(`<nav><div class="logo mono glow-g">janys.ponder</div><div class="links mono"><span>overview</span><span class="glow-c">☁ ask the frog</span><span class="pill">let's chat</span></div></nav>`);
const mini = (t) => add(`<svg class="mini" viewBox="0 0 100 100"><path d="M14 18 H70 Q86 18 86 34 V66 Q86 82 70 82 H14" fill="none" stroke="#3a4170" stroke-width="3"/>
  <path d="M14 18 H70 Q86 18 86 34 V66 Q86 82 70 82 H14" fill="none" stroke="#39ff88" stroke-width="3" pathLength="100" stroke-dasharray="${t} 100" style="filter:drop-shadow(0 0 4px #39ff88)"/>
  <text x="50" y="54" text-anchor="middle" fill="#8c93b8" font-size="10" font-family="JetBrains Mono">${Math.round(t)}%</text></svg>`);
const gauge = (on) => { const yrs = [['2026', 'BAM'], ['2025', 'Harvard Grid'], ['2025', 'Cathay'], ['2025', 'DfG × ISF'], ['2024', 'Ekimetrics'], ['2022', 'ACME Lab']];
  add(`<div class="gauge"><div class="rail"></div>${yrs.map(([y, n], i) => `<div class="m mono ${i === on ? 'on' : ''}" style="top:${8 + i * 16}%">${i === on ? n + ' · ' : ''}${y}<i></i></div>`).join('')}</div>`); };

window.addEventListener('world-ready', async () => {
  await document.fonts.ready;
  if (s === 'hero') {
    nav(); mini(2);
    add(`<div class="hero"><div class="kicker mono">HI, I'M</div><h1>Janys <span>(Jiayang)</span> Li</h1>
      <div class="tag">amphibian in the <em>how you think</em> &amp; <b>how I build</b></div>
      <div class="sub mono">DATA SCIENTIST · PRODUCT BUILDER · M.S. DATA SCIENCE @ HARVARD</div>
      <div class="icons mono"><div>in LinkedIn</div><div>⌥ GitHub</div><div>✉ janysli.jy@gmail.com</div></div></div>`);
    at(...(window.__cloud || [-4.5, 8.2, -3]), `<div class="mono glow-c" style="font-size:13px;letter-spacing:.12em">ask the frog</div>`);
    [['AI &amp; ML', -8], ['PRODUCT', -2], ['PROG &amp; DATA', 4]].forEach(([t, x]) => at(x, 2.4, -0.5, `<div class="tlabel mono">${t}</div>`));
    add(`<div class="cue mono">SCROLL TO HOP &nbsp;→</div><div class="fab mono">☁ ask the frog</div>`);
  }
  if (s === 'hop') {
    nav(); mini(9);
    const ai = ['Agentic AI', 'LLM Agents', 'RAG', 'Generative AI', 'Model Evaluation', 'NLP', 'Prompt Engineering', 'Automation'];
    const pr = ['0→1 Product', 'Product Strategy', 'Roadmapping', 'Journey Mapping', 'User Research', 'A/B Testing'];
    at(-8, 5.6, -0.5, `<div class="chips mono" style="color:#b99cff">${ai.map(k => `<span class="chip">${k}</span>`).join('')}</div>`);
    at(-1.2, 6.3, -0.5, `<div class="chips mono" style="color:#39ff88">${pr.map(k => `<span class="chip">${k}</span>`).join('')}</div>`);
    [['AI &amp; ML', -8], ['PRODUCT', -2], ['PROG &amp; DATA', 4]].forEach(([t, x]) => at(x, -0.9, 2, `<div class="tlabel mono">${t}</div>`));
    add(`<div class="cue mono">HOP 2 / 3 &nbsp;→</div>`);
  }
  if (s === 'dive') {
    nav(); mini(24);
    at(18.5, 5.2, 0, `<div class="mono glow-g" style="font-size:15px;letter-spacing:.3em">DIVE!</div>`);
    at(24, -4.6, -1, `<div class="mono glow-c" style="font-size:12px;letter-spacing:.2em">↓ EXPERIENCE · 2026 → 2022</div>`);
    add(`<div class="cue mono">SCROLL TO DIVE &nbsp;↓</div>`);
  }
  if (s === 'under') {
    nav(); mini(34); gauge(0);
    at(24, -7.6, 0, `<div class="card"><div class="meta mono">JUN – AUG 2026 · NEW YORK</div><h3>Balyasny Asset Management</h3>
      <div class="role">Summer Associate, Data Scientist</div><ul>
      <li>Built AI forecasting tools and agents for an investment firm.</li>
      <li>Built AI agents that test and explain models.</li></ul>
      <div class="tags mono"><span>Agentic AI</span><span>Forecasting</span><span>Model Eval</span><span>Stakeholders</span></div></div>`);
    at(18.2, -3.4, 0, `<div class="bubble problem" style="transform:translate(-10%,-100%)"><small class="mono" style="color:#8fb6ff">THE CLIENT</small>Can we trust our forecasts, faster?</div>`);
    at(29.8, -6.2, 0, `<div class="bubble result" style="transform:translate(-50%,-100%)"><small class="mono glow-g">TA-DA!</small>AI agents that test and explain models in minutes.</div>`);
  }
  if (s === 'seabed') {
    nav(); mini(96);
    add(`<div class="chat"><div class="mono glow-c" style="font-size:12px;letter-spacing:.3em;margin-bottom:10px">SEABED · YOU MADE IT</div>
      <h2 class="glow-g">Let's Chat</h2><p>Hiring, building something, or just curious how people think? Send a message in a bottle.</p>
      <div class="row"><div class="field">Name</div><div class="field">Email</div></div><div class="field">Organization (optional)</div>
      <div class="seg mono"><span class="on">Hiring</span><span>Collaboration</span><span>Just saying hi</span></div>
      <div class="field" style="height:78px">Your message…</div><div class="send">Send the bottle ↑</div>
      <div class="alt mono"><div>in Connect on LinkedIn</div><div>✉ Email me</div></div></div>`);
    at(-6.5, FLOOR_Y() + 3.2, 1.2, `<div class="mono glow-p" style="font-size:12px;letter-spacing:.18em">message in a bottle ↓</div>`);
  }
  if (s === 'map') {
    const L = (x, y, t, n, dx = 0, dy = 0) => at(x, y, 0, `<div class="mlabel"><b>${n}</b>${t}</div>`, dx, dy);
    L(-15, 7.5, 'Surface hub', '01'); L(-2, 5.5, 'Terraces: skills', '02'); L(21, 7.5, 'Dive', '03');
    [['BAM · 2026', -7], ['Harvard Grid · 2025–', -15], ['Cathay Pacific · 2025', -22.5], ['Develop for Good × ISF · 2025', -30], ['Ekimetrics · 2024', -37], ['ACME Lab · 2022–24', -43]]
      .forEach(([t, y]) => at(30.5, y, 0, `<div class="mono" style="font-size:13px;color:#cfd6ff;transform:translateX(50%)">${t}</div>`, 0, 0));
    L(-4, -53.5, "Seabed: Let's Chat", '04');
  }
  if (s === 'lineup') {
    [['BAM', 'octopus', -12.5], ['Harvard Grid', 'sea turtle', -6.5], ['Cathay Pacific', 'flying fish', -1], ['DfG × ISF', 'starfish', 4.2], ['Ekimetrics', 'hermit crab', 9], ['ACME Lab', 'jellyfish', 13.6]]
      .forEach(([n, a, x]) => at(x, -3.4, 0, `<div class="under-label">${n}<b>${a}</b></div>`));
  }
  if (s === 'frogs') {
    [['idle / sit', -8.5], ['hop', -2.6], ['ta-da!', 3], ['swim', 10.4]].forEach(([n, x]) => at(x, -1.2, 0, `<div class="under-label mono" style="color:#39ff88">${n}</div>`));
  }
  document.title = 'ready';
});
function FLOOR_Y() { return -62; }
</script>
<script type="module">
  const v = new URLSearchParams(location.search).get('v');
  if (v === '2' || v === '3') document.body.classList.add('v2');
  if (['3', '4', '5'].includes(v)) document.body.classList.add('v3');
  if (v === '4' || v === '5') document.body.classList.add('v4');

  if (v === '2' || v === '5') document.body.classList.add('v2');
  const P = new URLSearchParams(location.search);
  if (P.get('m') === '1' || innerWidth <= 600) { document.body.classList.add('mobile');
    const z = (+(P.get('w') || innerWidth)) / 390; window.__uiz = z; document.body.style.setProperty('--uiz', z); }
  if (v === '7') ['v2', 'v3', 'v4', 'v5', 'v6'].forEach(c => document.body.classList.add(c));
  if (v === '6') ['v2', 'v3', 'v4', 'v5', 'v6'].forEach(c => document.body.classList.add(c));
  import(v === '7' ? './world7.js' : v === '6' ? './world6.js' : v === '5' ? './world5.js' : v === '4' ? './world4.js' : v === '3' ? './world3.js' : v === '2' ? './world2.js' : './world.js');
</script>
